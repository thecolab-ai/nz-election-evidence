name: Source verification
about: Verify a publisher link, scope, denominator or rights state
title: "Source verification: "
labels: [source-research]
body:
  - type: input
    id: product
    attributes: {label: Product or roadmap ID, placeholder: P01 or R01}
    validations: {required: true}
  - type: input
    id: url
    attributes: {label: Primary source URL}
    validations: {required: true}
  - type: textarea
    id: claim
    attributes: {label: Exact claim and source locator, description: Separate publisher statement, observed fact, classification and interpretation.}
    validations: {required: true}
  - type: textarea
    id: uncertainty
    attributes: {label: Uncertainty and limitations, description: Use unverified when unsure; do not infer causation.}
    validations: {required: true}
  - type: checkboxes
    id: safety
    attributes:
      label: Safety checks
      options:
        - label: No copied source body, personal address or unnecessary contact detail is included.
          required: true
        - label: This request does not advocate for or against a party or person.
          required: true
