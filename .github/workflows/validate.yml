name: Validate catalogue
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalogue and publication boundary
        run: python3 scripts/validate.py
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
