<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">NZ Election Evidence network</title><desc id="desc">An abstract network of six evidence cards connected to a central public source ledger, illustrating traceable collaboration rather than political alignment.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#0b2d33"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-opacity=".3"/></filter></defs>
<rect width="1200" height="420" rx="28" fill="url(#bg)"/><g stroke="#42d6c5" stroke-width="3" opacity=".45"><path d="M230 105L600 210 965 92M215 315L600 210 987 322M600 210L330 350M600 210L855 365"/></g>
<g fill="#102f42" stroke="#55e2d1" filter="url(#s)"><rect x="410" y="128" width="380" height="164" rx="22"/><rect x="82" y="55" width="270" height="96" rx="16"/><rect x="52" y="270" width="285" height="96" rx="16"/><rect x="850" y="45" width="275" height="96" rx="16"/><rect x="865" y="270" width="280" height="96" rx="16"/></g>
<g fill="#eafcf9" font-family="system-ui,sans-serif"><text x="600" y="190" font-size="30" text-anchor="middle" font-weight="700">PUBLIC SOURCE LEDGER</text><text x="600" y="228" font-size="18" text-anchor="middle" fill="#a9ccc9">source · date · scope · uncertainty</text><text x="217" y="112" font-size="20" text-anchor="middle">Elections</text><text x="194" y="327" font-size="20" text-anchor="middle">Parliament</text><text x="987" y="102" font-size="20" text-anchor="middle">Social outcomes</text><text x="1005" y="328" font-size="20" text-anchor="middle">Economy &amp; housing</text></g><g fill="#ffca6a"><circle cx="600" cy="210" r="9"/><circle cx="230" cy="105" r="6"/><circle cx="215" cy="315" r="6"/><circle cx="965" cy="92" r="6"/><circle cx="987" cy="322" r="6"/></g>
</svg>
